<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>【デモ】7日連続達成｜今日のマインドスイッチ</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#43352d;background:#fff8ef}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 10%,#fff 0,#fff7ec 65%,#ffeddb 100%);min-height:100vh}.wrap{max-width:580px;margin:auto;padding:34px 18px 70px;text-align:center}.eyebrow{font-size:11px;letter-spacing:.18em;color:#bb7150;font-weight:bold;background:#f9e7dd;border-radius:30px;padding:8px 16px;display:inline-block}h1{font-size:25px;margin:17px 0 9px}h1 b{color:#c96047}.sub{font-size:13px;color:#88776c;line-height:1.9}.panel{background:#fff;border-radius:24px;padding:22px 15px 30px;margin-top:24px;box-shadow:0 12px 38px #b8825830}.scene{height:295px;perspective:850px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.halo{position:absolute;width:280px;height:230px;border-radius:50%;background:radial-gradient(ellipse,#fbe6d5 0%,#fff0df55 45%,transparent 70%);filter:blur(7px)}.prism{width:156px;height:194px;position:relative;transform-style:preserve-3d;transform:rotateX(-12deg) rotateY(0deg);will-change:transform}.face{position:absolute;inset:0;border:3px solid #d5a65e;border-radius:12px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;box-shadow:inset 0 0 0 5px #ffffff75,0 5px 15px #7a573a28}.face:nth-child(1){background:linear-gradient(145deg,#fff4f0,#f1b9b3);transform:rotateY(0deg) translateZ(45.03px)}.face:nth-child(2){background:linear-gradient(145deg,#f1f8ed,#b7dfc6);transform:rotateY(120deg) translateZ(45.03px)}.face:nth-child(3){background:linear-gradient(145deg,#f5f0ff,#d4c3f1);transform:rotateY(240deg) translateZ(45.03px)}.symbol{font-size:30px;color:#ae7e51}.face strong{font-size:20px;line-height:1.55}.face small{font-size:10px;letter-spacing:.15em;color:#886e61}.base{width:245px;height:20px;margin:-30px auto 24px;border-radius:50%;background:linear-gradient(#fff1c9,#c48a45 70%,#966333);box-shadow:0 9px 18px #9b6e3c40;position:relative}.base:after{content:'';position:absolute;top:11px;left:17px;right:17px;height:18px;border-radius:0 0 25px 25px;background:linear-gradient(#d8a66b,#9b6635)}button{border:0;border-radius:30px;background:#cb6c4a;color:white;font-size:16px;font-weight:bold;padding:15px 35px;cursor:pointer;box-shadow:0 7px 18px #b96b4a45}button:disabled{opacity:.6;cursor:wait}.result{margin-top:25px;padding:22px;background:#fff9f2;border-radius:17px;text-align:left;border:1px solid #f0e0cf}.result[hidden]{display:none}.tag{font-size:12px;color:#bd664b;font-weight:bold}.result h2{font-size:20px;margin:14px 0}.result p{font-size:14px;line-height:2}.step{padding:14px;background:#fff;border-left:4px solid #d27351;border-radius:8px;font-size:14px;font-weight:bold;line-height:1.7}.note{font-size:11px;color:#94857b;margin-top:20px;line-height:1.8}@media(prefers-reduced-motion:reduce){.prism{will-change:auto}}
.today{font-size:12px;color:#a58a76;margin-top:6px}.stamp-card{margin-top:20px;padding:18px 14px;background:#fffaf3;border:1px solid #f1e0cb;border-radius:17px;text-align:left}.stamp-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-size:14px}.stamp-head span{font-size:12px;color:#ad7756}.stamps{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0}.stamp{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:#f3ede6;color:#c6b7a7;font-size:19px;border:1px dashed #d9c8b7}.stamp.done{background:linear-gradient(145deg,#fff3c7,#e8b967);color:#9b5f26;border:1px solid #d4a35a}.tiny{font-size:12px;color:#8b776b;line-height:1.7}.action{margin-top:14px;padding:15px;background:#fff;border:1px solid #efdcc9;border-radius:12px}.action strong{display:block;font-size:13px;color:#b86c4a;margin-bottom:6px}.action p{margin:0 0 10px!important}.action button{font-size:13px;padding:10px 16px;box-shadow:none}.action button.completed{background:#638b73}.rare-banner{background:linear-gradient(115deg,#fff2bf,#e9b85f,#fff2c2);border:1px solid #c99845;border-radius:12px;padding:13px;margin:0 0 16px;text-align:center;color:#80501d;font-weight:800}.prism.rare .face{border-color:#e9c04f;box-shadow:inset 0 0 0 5px #fff7ce,0 0 30px #f3c34eaa}.prism.rare .face:nth-child(1),.prism.rare .face:nth-child(2),.prism.rare .face:nth-child(3){background:linear-gradient(135deg,#fff9dc,#f0cc73,#d99b3e)}.prism.rare{filter:none}.prism.rare .face{animation:goldGlow 2.2s ease-in-out infinite alternate}@keyframes goldGlow{from{box-shadow:inset 0 0 0 5px #fff7ce,0 0 10px #e8b95588}to{box-shadow:inset 0 0 0 5px #fff7ce,0 0 24px #e8b955cc}}.celebrate{animation:celebrate 1.5s ease-in-out 3}@keyframes celebrate{0%,100%{filter:drop-shadow(0 0 0 #ffd35a)}50%{filter:drop-shadow(0 0 28px #ffd35a)}}.reward{margin-top:12px;padding:14px;background:#fff2d8;border-radius:12px;color:#845724;font-size:13px;line-height:1.8}.muted{font-size:11px;color:#9b8878;margin-top:10px}
button.locked{background:#9b8c80;box-shadow:none;opacity:1;cursor:not-allowed;font-size:14px}
</style></head><body><main class="wrap"><div class="eyebrow">7日連続達成イベント・デモ</div><h1><b>『遊！』</b> 今日のマインドスイッチ</h1><p class="sub">モヤモヤした気持ちに、今日の小さなヒントを。<br>三角柱を回して、今のあなたへの言葉を受け取ろう。</p><div class="today" id="today"></div><section class="panel"><div class="scene"><div class="halo"></div><div class="prism" id="prism"><div class="face"><span class="symbol">☾</span><strong>悪い<br>あの人</strong><small>RELEASE</small></div><div class="face"><span class="symbol">✦</span><strong>これから<br>どうするか</strong><small>TAKE A STEP</small></div><div class="face"><span class="symbol">♡</span><strong>かわいそうな<br>私</strong><small>BE KIND</small></div></div></div><div class="base"></div><button id="spin">↻ 三角柱を回す</button><div id="result" class="result" hidden aria-live="polite"><div class="tag" id="tag"></div><h2 id="headline"></h2><p id="message"></p><p id="faceComment" class="tiny" style="background:#fff;border-radius:10px;padding:12px 14px;border-left:3px solid #d5a65e"></p><div class="action"><strong>🍀 今日の開運アクション</strong><p id="actionText"></p><button id="actionDone" type="button">今日の一歩を決めた！</button><div class="muted" id="actionStatus"></div></div></div><div class="stamp-card"><div class="stamp-head">✦ 7日間のこころスタンプ <span id="stampCount">0 / 7日</span></div><div class="stamps" id="stamps"></div><div class="tiny" id="stampInfo">1日1回、ルーレットを回すとスタンプが貯まります。</div><div id="reward" class="reward" hidden></div></div></section><p class="note">『幸せになる勇気』に登場する三角柱の考え方に着想を得たオリジナルコンテンツです。家計・お金に関する言葉も登場します。<br>占いは気持ちを整えるきっかけとしてお楽しみください。</p></main><script>
const expandedMessages=[[["怒りをほどく日","相手への怒りが残っていても大丈夫。自分の時間を少し取り戻す選択をしてみましょう。"],["境界線を引く日","すべての頼みごとに応える必要はありません。大切な時間を守ることも選択です。"],["言葉を受け流す日","誰かの一言であなたの価値は決まりません。自分の基準を大切にしましょう。"],["期待を整理する日","相手に期待していたことを言葉にすると、次に望む関係が見えてきます。"],["比較から離れる日","誰かの成果が気になるときは、自分が大事にしたい暮らしを思い出しましょう。"],["返信を急がない日","気持ちが波立つときは、落ち着いてから返事をしても構いません。"],["小さな距離を取る日","少し離れるだけで、出来事を別の角度から見られることがあります。"],["思い込みを見直す日","相手の意図を決めつけず、事実と想像を分けてみましょう。"],["自分のペースを守る日","周囲の速さに合わせなくても、あなたに合う歩き方があります。"],["違いを認める日","価値観が違う人を変えるより、付き合い方を選ぶこともできます。"],["不満をヒントにする日","気になる出来事には、自分が大切にしている価値が隠れているかもしれません。"],["責める言葉を減らす日","誰かを責めたくなったら、まず自分の希望を短く言葉にしてみましょう。"],["自分の機嫌を取り戻す日","他人の行動に左右された時間を、好きなことに少し使ってみませんか。"],["違う道を選ぶ日","相手と同じ考えになる必要はありません。自分が納得できる道を探しましょう。"],["感情をメモする日","怒りの奥にある悲しさや不安に気づくと、次の行動が見えてきます。"],["損得を落ち着いて見る日","誰かの買い物や収入と比べず、自分の家計の目的に目を向けましょう。"],["お金の境界線を守る日","気の進まない出費の誘いは、丁寧に断っても大丈夫です。"],["情報に振り回されない日","他人の投資成果は参考程度に。自分の方針を確認することが大切です。"],["焦る買い物を避ける日","誰かのおすすめより、自分に必要かどうかを基準にしてみましょう。"],["比べない家計の日","生活費も価値観も人それぞれ。自分の納得できる使い方を選びましょう。"],["思いやりを忘れない日","意見が違っても、互いを尊重する言葉を選ぶことはできます。"],["一呼吸おく日","すぐに反論しないことで、自分の気持ちを守れる場面もあります。"],["お願いを伝える日","責める代わりに、どうしてほしいかを具体的に伝えてみましょう。"],["余計な争いを手放す日","すべてに勝つ必要はありません。大切なことに力を残しましょう。"],["自分の基準を持つ日","周囲の評価より、自分が大事にしている約束を確かめましょう。"],["話す相手を選ぶ日","気持ちを整理したいときは、安心して話せる相手を頼ってみましょう。"],["正しさより対話の日","正解を競うより、互いの事情を知る一言が役立つかもしれません。"],["心のスペースを作る日","相手のことばかり考えているときは、今ここにある楽しみを探しましょう。"],["小さな選択を尊ぶ日","相手を変えられなくても、自分の次の一歩は選べます。"],["自分を取り戻す日","嫌な出来事は人生のすべてではありません。今日の時間を少し自分に返しましょう。"]],[["小さな一歩の日","未来を一度に変えなくても大丈夫。今日できることをひとつ選びましょう。"],["二分だけ始める日","完璧な準備より、短い行動が次のきっかけになります。"],["自分で選ぶ日","周囲の期待だけでなく、自分が大切にしたいことを確認しましょう。"],["相談する勇気の日","助けを借りることも立派な行動です。ひとりで抱え込まなくて大丈夫。"],["進歩を見つける日","昨日よりほんの少し進んだことがあれば、それは大切な変化です。"],["休むことを選ぶ日","次の一歩は休息かもしれません。自分の状態に合わせて選びましょう。"],["予定を一つ決める日","やりたいことを小さく予定に入れると、実現に近づきます。"],["学びの種をまく日","知らないことに出会ったら、ひとつ調べてみるだけで十分です。"],["ありがとうを伝える日","感謝の言葉が、今日の人間関係を少し温めるかもしれません。"],["挑戦を小さくする日","大きな目標は、小さな作業に分けると取り組みやすくなります。"],["家計を見つめる日","お金の安心は、現状を知ることから。まずは支出を一つ確認しましょう。"],["固定費を function dayKey(d=new Date()){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function localDate(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function read(){try{return JSON.parse(localStorage.getItem('yu_kokoro_demo_v1'))||{days:[],completed:[],rewards:0}}catch(e){return {days:[],completed:[],rewards:0}}}

function consecutiveStreak(days,today){const set=new Set(days||[]);let cursor=localDate(today);if(!set.has(today))cursor.setDate(cursor.getDate()-1);let count=0;while(set.has(dayKey(cursor))){count++;cursor.setDate(cursor.getDate()-1)}return count}

function chooseAction(today,pick){
 const v=read();v.actionHistory=Array.isArray(v.actionHistory)?v.actionHistory:[];
 const key=today+':'+pick;
 const previous=v.actionHistory.find(e=>e.key===key);
 if(previous && actionPool.includes(previous.action))return previous.action;
 const cutoff=new Date(localDate(today));cutoff.setDate(cutoff.getDate()-6);
 const recent=new Set(v.actionHistory.filter(e=>e.date>=dayKey(cutoff)).map(e=>e.action));
 // 金銭テーマも自然に混ざるよう、約4回に1回はお金カテゴリから選ぶ。
 const money=(hash(key+':money')%4===0);
 const pool=money?[...actionGroups['お金・家計'],...actionGroups['お金・未来']]:actionPool;
 const candidates=pool.filter(a=>!recent.has(a));
 const choices=candidates.length?candidates:pool;
 const action=choices[hash(key+':action')%choices.length];
 v.actionHistory=v.actionHistory.filter(e=>e.key!==key && e.date>=dayKey(new Date(localDate(today).getTime()-35*86400000)));
 v.actionHistory.push({key,date:today,action});save(v);return action;
}
